# Elasticsearch de un solo nodo, SOLO desarrollo (seguridad desactivada). Puerto 9200.
# Requiere vm.max_map_count>=262144 en Linux: sudo sysctl -w vm.max_map_count=262144
services:
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:9.0.0
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: "-Xms512m -Xmx512m"
    ports:
      - "127.0.0.1:9200:9200"
    volumes:
      - esdata:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:9200/_cluster/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
volumes:
  esdata:
